name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-flow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-flow:
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@v0.2.0
    secrets: inherit
    with:
      ci-profile: custom
      ci-install-command: bun install --frozen-lockfile
      ci-test-command: bun run test
      ci-docker-smoke-command: docker build -t test-build . && docker image rm test-build
      enable-package: false
      enable-container: true
      enable-release: true
      container-registry: both
      container-image-name: zentrynel
      container-release-platforms: linux/amd64
